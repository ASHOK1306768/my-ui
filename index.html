<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub UI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        button { background-color: #2da44e; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #2c974b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Hello, User!</h2>
        <p>This is a functional user interface created and hosted entirely through GitHub.</p>
        <button onclick="alert('UI is working!')">Click Me</button>
    </div>
</body>
</html>
